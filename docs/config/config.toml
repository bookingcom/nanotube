# Sample NT config.

# Please refer to conf/conf.go for documentation.

# WARNING: This is a sample config. You most likely need to tweak it for your use case.


# Clusters config path. Mandatory.
ClustersConfig = "config/clusters.toml"
# Rules config path. Mandatory.
RulesConfig = "config/rules.toml"
# Rewrites config path. Optional.
RewritesConfig = ""
# RewritesConfig = "config/rewrite.toml" to enable

TargetPort = 2004

ListenTCP = ":2003"
ListenUDP = ""

UDPOSBufferSize = 0

MainQueueSize = 100000
HostQueueSize = 50000

IncomingConnIdleTimeoutSec = 90
SendTimeoutSec = 5
OutConnTimeoutSec = 5
TermTimeoutSec = 10

TCPOutBufSize = 4096

# Applies to all TCP targets; cluster/host compression overrides may canary it.
# Empty (default) or "none" sends plaintext; "zstd" sends independent frames.
# Upgrade all receivers before enabling. gRPC targets ignore these settings.
# Total stream dictionary capacity across all configured TCP destinations.
StreamDictionaryBytes = 1073741824
# Exact arena-backed names instead of statistical 128-bit identities.
StreamFullNames = false
TCPOutCompression = ""
TCPOutZstdLevel = "fastest" # "fastest" or "default"
TCPOutZstdFrameSize = 1048576 # plaintext bytes per frame; maximum 16 MiB

TCPOutBufFlushPeriodSec = 2

TCPOutConnectionRefreshPeriodSec = 0

GRPCOutKeepAlivePeriodSec = 5
GRPCOutKeepAlivePingTimeoutSec = 1
GRPCOutBackoffMaxDelaySec = 30
GRPCOutMinConnectTimeoutSec = 5

GRPCTracing = true

MaxHostReconnectPeriodMs = 5000
HostReconnectPeriodDeltaMs = 10

NormalizeRecords = true
LogSpecialRecords = false

PidFilePath = ""

LogLimitInitial = 10
LogLimitThereafter = 1000
LogLimitWindowSec = 1

PprofPort = 6000
PromPort = 9090
LessMetrics = false
RegexDurationMetric = false

HostQueueLengthBucketFactor = 3.0
HostQueueLengthBuckets = 10

ProcessingDurationBucketFactor = 2.0
ProcessingDurationBuckets = 10
# Optional cache shared by processing workers. Zero disables it; 2 GiB is a
# starting budget for a few million names. See ../route-cache.md for accounting,
# reload behavior and hit/miss/eviction metrics.
RouteCacheBytes = 0
