# Cluster is the routing unit and defines a set of targets.
[[cluster]]
name = 'local0'
type = 'jump' # cluster type defines routing inside a cluster
# compression = 'zstd' # optional: overrides the main config for this pool
    [[cluster.hosts]]
    name = 'localhost' # FQDN or IP of the host
    port = 8001 # optional, overrides setting in main config
    # compression = 'none' # optional: host overrides cluster, then global default
    index = 0 # index in the hash ring 
    [[cluster.hosts]]
    name = 'localhost'
    port = 8002
    index = 1

[[cluster]]
name = 'local1'
type = 'jump'
    [[cluster.hosts]]
    name = 'localhost'
    port = 8101
    index = 0
    [[cluster.hosts]]
    name = 'localhost'
    port = 8102
    index = 1
    [[cluster.hosts]]
    name = 'localhost'
    port = 8103
    index = 2
    [[cluster.hosts]]
    name = 'localhost'
    port = 8104
    index = 3
    grpc = true # sets the target host to use GRPC protocol

# Binary stream output requires a go-carbon receiver with stream enabled.
[[cluster]]
name = 'stream-example'
type = 'toall'
    [[cluster.hosts]]
    name = 'localhost'
    port = 2004
    stream = true # TCP binary stream; mutually exclusive with grpc
    mtcp = 2 # optional; each connection has an independent dictionary
    [cluster.hosts.stream_options]
    max_rows = 4096
    max_bytes = 1048576
    flush_period_ms = 1000
    zstd = false
    max_names = 4194304
